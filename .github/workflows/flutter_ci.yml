name: Flutter CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 'any'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Run flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: |
          flutter test \
            --coverage \
            --reporter=github

      - name: Check coverage threshold
        run: |
          sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold 60%"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info/

      - name: Get APK sizes
        id: apk_sizes
        run: |
          ARM64=$(du -sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -f1)
          ARMEABI=$(du -sh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | cut -f1)
          X86=$(du -sh build/app/outputs/flutter-apk/app-x86_64-release.apk | cut -f1)
          echo "arm64=$ARM64" >> $GITHUB_OUTPUT
          echo "armeabi=$ARMEABI" >> $GITHUB_OUTPUT
          echo "x86=$X86" >> $GITHUB_OUTPUT
          echo "### APK Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| ABI | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          echo "| arm64-v8a | $ARM64 |" >> $GITHUB_STEP_SUMMARY
          echo "| armeabi-v7a | $ARMEABI |" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64 | $X86 |" >> $GITHUB_STEP_SUMMARY

      - name: Check APK size budget
        run: |
          ARM64_BYTES=$(stat -c%s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          MAX_BYTES=$((55 * 1024 * 1024))
          echo "arm64 APK size: $(numfmt --to=iec $ARM64_BYTES)"
          if [ $ARM64_BYTES -gt $MAX_BYTES ]; then
            echo "arm64 APK exceeds 55MB budget! Current: $(numfmt --to=iec $ARM64_BYTES)"
            exit 1
          fi
          echo "APK size within budget."

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 14

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.sha }}
          path: build/debug-info/
          retention-days: 30

  comment_pr:
    name: Comment PR Results
    runs-on: ubuntu-latest
    needs: [analyze, build_apk]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apk-release-${{ github.sha }}
          path: apks/

      - name: Get APK sizes for comment
        id: sizes
        run: |
          ARM64=$(du -sh apks/app-arm64-v8a-release.apk | cut -f1)
          ARMEABI=$(du -sh apks/app-armeabi-v7a-release.apk | cut -f1)
          X86=$(du -sh apks/app-x86_64-release.apk | cut -f1)
          echo "arm64=$ARM64" >> $GITHUB_OUTPUT
          echo "armeabi=$ARMEABI" >> $GITHUB_OUTPUT
          echo "x86=$X86" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const arm64 = '${{ steps.sizes.outputs.arm64 }}';
            const armeabi = '${{ steps.sizes.outputs.armeabi }}';
            const x86 = '${{ steps.sizes.outputs.x86 }}';
            const sha = context.sha.substring(0, 7);
            const body = [
              '## CI Results',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| flutter analyze | ✅ 0 issues |',
              '| flutter test | ✅ All passed |',
              '| APK build | ✅ Success |',
              '',
              '### APK Sizes (`' + sha + '`)',
              '',
              '| ABI | Size | Budget |',
              '|-----|------|--------|',
              `| arm64-v8a | ${arm64} | ≤ 55MB ✅ |`,
              `| armeabi-v7a | ${armeabi} | — |`,
              `| x86_64 | ${x86} | — |`,
              '',
              '> APK artifacts tersedia di tab **Actions → Artifacts** selama 14 hari.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('CI Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }