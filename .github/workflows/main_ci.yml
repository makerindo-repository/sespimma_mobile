name: 🚀 Build & Analyze Flutter App

# ===================================================================
# TRIGGER: Hanya jalan ketika push ke branch 'main'
# Jadi kalau push ke branch lain (feature, dev), TIDAK akan menguras kuota/billing
# ===================================================================
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Step 1: Checkout code dari GitHub ──
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Setup Java (Wajib untuk build Android) ──
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Step 3: Setup Flutter ──
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Step 4: Install Dependencies ──
      - name: Install dependencies
        run: flutter pub get

      # ── Step 5: Pengecekan Kode (Linting & Unit Test) ──
      - name: Run Analyze & Test
        run: |
          echo "========================================="
          echo "Starting analysis and testing..."
          echo "========================================="
          # Create dummy .env file to prevent 'asset_does_not_exist' warning
          touch .env
          flutter analyze --no-fatal-infos
          flutter test

      # ── Step 6: Build APK ──
      - name: Build APK (split per ABI)
        run: |
          echo "========================================="
          echo "Building APK..."
          echo "========================================="
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info/

      # ── Step 7: Simpan APK ke Artifact ──
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 5
